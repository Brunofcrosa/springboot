# Nome da aplicação, usado nos logs e pelo contexto do Spring Boot.
spring.application.name=salas-api

# Dados de conexão com o PostgreSQL iniciado pelo compose.yaml.
spring.datasource.url=jdbc:postgresql://localhost:5499/salasdb
spring.datasource.username=postgres
spring.datasource.password=postgres

# Porta em que o servidor HTTP da API ficará disponível.
server.port=8999

# O banco é criado e alterado pelo Flyway, então o Hibernate apenas confere
# se as tabelas existentes são compatíveis com as entidades Java.
spring.jpa.hibernate.ddl-auto=validate

# Exibe as consultas SQL no terminal, útil para estudar o que o JPA executa.
spring.jpa.show-sql=true

# Deixa o SQL exibido no terminal mais legível.
spring.jpa.properties.hibernate.format_sql=true

# Fecha a sessão do banco ao terminar a camada de serviço, evitando consultas
# automáticas durante a montagem da resposta HTTP.
spring.jpa.open-in-view=false

# Ativa a execução das migrations localizadas em db/migration.
spring.flyway.enabled=true

# Ativa a geração da especificação OpenAPI e da interface Swagger UI.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Caminho da página visual do Swagger.
springdoc.swagger-ui.path=/swagger-ui.html

# Caminho do JSON que descreve a API no padrão OpenAPI.
springdoc.api-docs.path=/api-docs
